plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.faraway.app'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.faraway.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// 依存ライブラリはなし（標準の WebView だけを使う）
